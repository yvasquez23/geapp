name: Build Flutter (Android + iOS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Android APK ──────────────────────────────────────────────────────────────
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # ── iOS IPA ──────────────────────────────────────────────────────────────────
  ios:
    name: Build iOS IPA
    runs-on: macos-latest   # requiere runner macOS
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install

      # Sin firma: genera un build sin IPA (útil para verificar que compila)
      - name: Compilar iOS (sin firma)
        run: flutter build ios --release --no-codesign

      # Con firma: descomenta y agrega los secrets en GitHub > Settings > Secrets
      # - name: Compilar IPA firmado
      #   env:
      #     CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      #     CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      #     PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      #   run: |
      #     echo "$CERTIFICATE_BASE64" | base64 --decode > cert.p12
      #     echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
      #     flutter build ipa --release

      - name: Subir build iOS como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 7
