workflows:

  # ── Android (APK) ────────────────────────────────────────────────────────────
  android-release:
    name: Android Release APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Instalar dependencias
        script: flutter pub get
      - name: Compilar APK release
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - vasqueyunior6@gmail.com  # ← tu correo
        notify:
          success: true
          failure: true

  # ── iOS (sin firma — verifica que el código compila) ─────────────────────────
  # Para generar un IPA instalable necesitas una cuenta Apple Developer ($99/año)
  # y subir el certificado en: Codemagic > App settings > Code signing > iOS
  ios-release:
    name: iOS Build (sin firma)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias Flutter
        script: flutter pub get
      - name: Instalar pods iOS
        script: |
          cd ios
          pod repo update
          pod install --repo-update
      - name: Compilar iOS sin firma
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - vasqueyunior6@gmail.com
        notify:
          success: true
          failure: true
